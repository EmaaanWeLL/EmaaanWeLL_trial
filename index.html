<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Bebi ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="hearts"></div>
    <div class="container" id="homeScreen">

        <h1>For My Bebi ❤️</h1>

        <p>
            Hi bebi.
            <br><br>
            I Know this is a bit random, but I wanted to make something for you.
            I made this little place for you.
            Whenever you're feeling something,
            come back here and let me keep you company.
        </p>

        <button id="startButton">
            Open My Heart
        </button>
         </p>

<audio id="bgMusic" loop>
    <source src="music/song1.mp3" type="audio/mpeg">
</audio>

<button id="musicButton">🎵 Play Music</button>
    </div>

    <script src="script.js" defer></script>

    <div class="container hidden" id="menuScreen" style="display:none;">

    <h1>Choose One ❤️</h1>

    <button class="menuButton">Open when you miss me</button><br>

    <button class="menuButton">Open when you're sad</button><br>

    <button class="menuButton">Open when you want to laugh</button><br>

    <button class="menuButton">Open when you can't sleep</button><br>

    <button class="menuButton">Open when you need motivation</button><br>
     <button id="backButton" class="menuButton">Back</button>

</div>
</body>
</html>
